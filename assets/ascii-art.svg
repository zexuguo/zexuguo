<svg width="420" height="514" viewBox="0 0 420 514" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="var(--card-a)"/>
    <stop offset="100%" stop-color="var(--card-b)"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
<style>
  :root {
    --bg: #f4f6fb;
    --card-a: rgba(255,255,255,0.62);
    --card-b: rgba(255,255,255,0.28);
    --border: rgba(15,23,42,0.10);
    --ascii: #16213a;
    --accent: #2563eb;
    --title: #64748b;
    --dot1:#ff5f56; --dot2:#ffbd2e; --dot3:#27c93f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0c10;
      --card-a: rgba(255,255,255,0.06);
      --card-b: rgba(255,255,255,0.02);
      --border: rgba(255,255,255,0.10);
      --ascii: #dbe4f3;
      --accent: #4f8cff;
      --title: #8b96a8;
    }
  }
  .bg { fill: var(--bg); }
  .card { fill: url(#cardGrad); stroke: var(--border); stroke-width: 1; }
  .title { fill: var(--title); font: 600 11px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; letter-spacing: 0.4px; }
  .ascii { fill: var(--ascii); font: 7.2px/1 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  .accent { fill: var(--accent); }
  .dot1{fill:var(--dot1)} .dot2{fill:var(--dot2)} .dot3{fill:var(--dot3)}
  .row { opacity: 0; animation: reveal 0.7s ease forwards; }
  @keyframes reveal { to { opacity: 1; } }
  .cursor { animation: blink 1s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { animation: pulseGlow 3s ease-in-out infinite; }
  @keyframes pulseGlow { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
</style>
<rect class="bg" width="420" height="514" rx="18"/>
<rect class="card pulse" x="4" y="4" width="412" height="506" rx="16" filter="url(#glow)"/>
<circle class="dot1" cx="32" cy="32" r="4.2"/>
<circle class="dot2" cx="46" cy="32" r="4.2"/>
<circle class="dot3" cx="60" cy="32" r="4.2"/>
